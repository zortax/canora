[package]
name = "canora"
version = "0.1.0"
edition = "2024"
authors = ["Leonard Seibold <git@zrtx.de>"]
license = "Apache-2.0"

[package.metadata.bundle]
name = "canora"
identifier = "dev.canora.Canora"

[dependencies]
# UI
zgui = { git = "https://github.com/zortax/zgui", features = ["tokio"] }
zgui-ui = { git = "https://github.com/zortax/zgui" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui" }
zgui-image = { git = "https://github.com/zortax/zgui" }

# Spotify
librespot-core = "0.8"
# The audio backend is chosen per platform, below.
librespot-oauth = "0.8"
http = "1"
librespot-protocol = "0.8"
protobuf = "3"

# Async
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
librespot-playback = { version = "0.8", default-features = false, features = [
    "pulseaudio-backend",
] }
mpris-server = "0.10"

[target.'cfg(not(target_os = "linux"))'.dependencies]
librespot-playback = { version = "0.8", default-features = false, features = [
    "rodio-backend",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSImage",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-media-player = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }

[build-dependencies]
# Not used here. librespot-core's build script feeds `vergen::Build` to an emitter from
# vergen-gitcl, and vergen 9.1 moved to the vergen-lib 9.x line while vergen-gitcl 1.0 still
# uses vergen-lib 0.1. The two `Add` traits then differ and librespot-core fails to build.
# Pinning here holds the resolver at the last working version across `cargo update`.
vergen = "=9.0.6"

[profile.dev]
# The framework and the audio pipeline are both slow when unoptimised. Build the dependencies
# with optimisation and keep the application itself quick to rebuild.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
